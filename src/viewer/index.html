<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MSDD Spec Viewer</title><link rel="stylesheet" href="/styles.css"></head>
  <body>
    <main class="app" aria-live="polite">
      <section class="landing" id="landing">
        <h1>MSDD Spec Viewer</h1>
        <button class="primary" id="choose-folder" type="button">Choose project folder</button>
        <p>Select a project folder that contains a <code>specs</code> directory.</p>
        <section class="recent" id="recent-folders" hidden aria-labelledby="recent-heading"><h2 id="recent-heading">Recent folders</h2><div id="recent-list"></div></section>
        <input id="directory-input" type="file" webkitdirectory multiple hidden>
      </section>
      <section class="workspace" id="workspace" hidden>
        <aside aria-label="Specifications"><h2>Specs</h2><nav id="spec-tree"></nav></aside>
        <article id="reader" aria-label="Document reader"><p class="empty">Choose a specification to read it.</p></article>
      </section>
      <p class="message" id="message" role="status"></p>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
