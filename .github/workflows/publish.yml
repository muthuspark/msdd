name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'muthuspark/msdd' && !github.event.release.draft && !github.event.release.prerelease
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Validate release and publishing toolchain
        run: node scripts/release-check.js

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Validate package
        run: npm run package:check

      - name: Publish package
        run: npm publish --access public --tag latest --provenance
